<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🔒 偷狗 · 论坛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family:  -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #333;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== Login ===== */
  #loginScreen {
    width: 100%;
    max-width: 440px;
    padding: 40px 24px;
    text-align: center;
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  #loginScreen .logo { font-size: 3rem; margin-bottom: 8px; }
  #loginScreen h1 { font-size: 1.8rem; font-weight: 600; color: #333; margin-bottom: 4px; letter-spacing: 4px; }
  #loginScreen h1 span { color: #7c6cf0; }
  #loginScreen p { color: #999; font-size: 0.85rem; margin-bottom: 28px; }

  .login-error { color: #ff6b6b; font-size: 0.82rem; margin-top: 8px; min-height: 1.2em; }

  .login-field { margin-bottom: 14px; text-align: left; }
  .login-field label {
    display: block;
    font-size: 0.82rem;
    color: #999;
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
    background: #fafafa;
    color: #333;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s;
  }
  .login-field input:focus { border-color: #7c6cf0; }

  /* ===== Avatar Section ===== */
  .avatar-section { margin-bottom: 16px; text-align: left; }
  .avatar-section .section-label {
    font-size: 0.82rem; color: #999; margin-bottom: 8px; display: block;
  }

  .avatar-tabs {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .avatar-tab {
    padding: 6px 16px; border-radius: 20px;
    font-size: 0.8rem; cursor: pointer; border: 1px solid #e0e0e0;
    background: #fafafa; color: #999; transition: all .2s;
  }
  .avatar-tab.active { background: #7c6cf0; color: #fff; border-color: #7c6cf0; }

  .avatar-gallery {
    display: flex; flex-wrap: wrap; gap: 8px;
    max-height: 120px; overflow-y: auto; padding: 4px 0;
  }
  .avatar-gallery::-webkit-scrollbar { width: 4px; }
  .avatar-gallery::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .avatar-item {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid transparent; cursor: pointer;
    object-fit: cover; background: #f5f5f5;
    transition: border-color .2s, transform .15s;
    flex-shrink: 0;
  }
  .avatar-item:hover { transform: scale(1.1); }
  .avatar-item.selected { border-color: #7c6cf0; }

  .avatar-upload-card {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px dashed #ddd; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: #ccc; background: #fafafa;
    transition: all .2s; flex-shrink: 0;
  }
  .avatar-upload-card:hover { border-color: #7c6cf0; color: #7c6cf0; }

  .avatar-preview-row {
    display: flex; align-items: center; gap: 12px; margin-top: 8px;
  }
  .avatar-preview-row img {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover; border: 3px solid #7c6cf0;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #7c6cf0;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    letter-spacing: 1px;
  }
  .btn-primary:hover { background: #6a5cd6; }

  /* ===== Chat ===== */
  #chatScreen {
    display: none;
    width: 100%;
    height: 100vh;
    max-width: 800px;
    margin: 0 auto;
    flex-direction: column;
    animation: fadeIn .3s ease;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  .chat-header .room-info { display: flex; align-items: center; gap: 10px; }
  .chat-header .room-info h2 { font-size: 1.05rem; font-weight: 600; color: #333; }
  .chat-header .room-info .member-count {
    font-size: 0.78rem; color: #999; background: #f0f0f0;
    padding: 2px 10px; border-radius: 10px;
  }
  .chat-header .user-badge { display: flex; align-items: center; gap: 8px; }
  .chat-header .user-badge .my-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    object-fit: cover; background: #f0f0f0;
  }
  .chat-header .logout-btn {
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid #ddd; background: transparent; color: #999;
    cursor: pointer; font-size: 0.78rem; transition: all .2s;
  }
  .chat-header .logout-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

  .messages-area {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    background: #fafafa;
  }
  .messages-area::-webkit-scrollbar { width: 6px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

  .msg-system { text-align: center; color: #bbb; font-size: 0.78rem; padding: 4px 0; }

  .msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn .25s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.own { align-self: flex-end; flex-direction: row-reverse; }
  .msg.other { align-self: flex-start; }

  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    object-fit: cover; background: #f0f0f0; flex-shrink: 0;
  }
  .msg-body { min-width: 0; }
  .msg .msg-name { font-size: 0.75rem; color: #999; margin-bottom: 3px; }
  .msg.own .msg-name { text-align: right; }
  .msg .msg-bubble {
    padding: 10px 14px; border-radius: 16px;
    font-size: 0.9rem; line-height: 1.55;
    word-break: break-word; display: inline-block;
  }
  .msg.own .msg-bubble { background: #7c6cf0; color: #fff; border-bottom-right-radius: 4px; }
  .msg.other .msg-bubble { background: #fff; color: #333; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  .msg .msg-time { font-size: 0.68rem; color: #bbb; margin-top: 2px; }
  .msg.own .msg-time { text-align: right; }
  .msg img.msg-img {
    max-width: 200px; max-height: 200px;
    border-radius: 12px; display: block; margin-top: 4px;
    cursor: pointer; transition: transform .2s;
  }
  .msg img.msg-img:hover { transform: scale(1.03); }

  .chat-input {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px; background: #fff;
    border-top: 1px solid #eee; flex-shrink: 0;
  }
  .chat-input .tool-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid #eee; background: #fff; color: #999;
    font-size: 1.2rem; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .chat-input .tool-btn:hover { background: #f5f5f5; color: #7c6cf0; border-color: #7c6cf0; }

  .chat-input input[type="text"] {
    flex: 1; padding: 10px 16px; border-radius: 24px;
    border: 1px solid #eee; background: #fafafa;
    color: #333; font-size: 0.9rem; outline: none; transition: border-color .2s;
  }
  .chat-input input[type="text"]:focus { border-color: #7c6cf0; }
  .chat-input .send-btn {
    padding: 10px 20px; border-radius: 24px;
    border: none; background: #7c6cf0; color: #fff;
    font-size: 0.9rem; cursor: pointer; font-weight: 500;
    transition: background .2s; white-space: nowrap;
  }
  .chat-input .send-btn:hover { background: #6a5cd6; }

  .emoji-picker {
    display: none;
    position: absolute; bottom: 72px; left: 20px;
    width: 300px; max-height: 220px;
    background: #fff; border: 1px solid #eee;
    border-radius: 16px; padding: 12px; overflow-y: auto;
    z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,.08);
  }
  .emoji-picker.show { display: block; }
  .emoji-picker .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-picker .emoji-item {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; cursor: pointer; border-radius: 8px;
    transition: background .15s;
  }
  .emoji-picker .emoji-item:hover { background: #f5f5f5; }

  .chat-input-wrap { position: relative; flex: 1; display: flex; align-items: center; gap: 8px; }

  @media (max-width: 500px) {
    #loginScreen { padding: 24px 16px; }
    .msg { max-width: 92%; }
    .emoji-picker { width: 260px; left: 8px; }
  }

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-panel{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:24px;max-height:85vh;overflow-y:auto;animation:fadeUp .3s ease}
.modal-panel h3{font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-panel h3 .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;color:#999;cursor:pointer;font-size:1.1rem}
.modal-panel .field{margin-bottom:14px}
.modal-panel .field label{display:block;font-size:.82rem;color:#999;margin-bottom:6px}
.modal-panel .field input,.modal-panel .field textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #e0e0e0;background:#fafafa;color:#333;font-size:.9rem;outline:none;transition:border-color .2s;font-family:inherit}
.modal-panel .field input:focus,.modal-panel .field textarea:focus{border-color:#7c6cf0}
.modal-panel .field textarea{min-height:100px;resize:vertical}
.image-upload-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.image-preview{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid #eee}
.image-preview-wrap{position:relative;display:inline-block}
.image-preview-wrap .remove-img{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#ff6b6b;color:#fff;font-size:.7rem;cursor:pointer}
.image-add-card{width:72px;height:72px;border-radius:10px;border:2px dashed #ddd;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#ccc;cursor:pointer;transition:all .2s;flex-shrink:0}
.image-add-card:hover{border-color:#7c6cf0;color:#7c6cf0}
.post-list-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f0f0}
.post-list-header h3{font-size:1rem;font-weight:600;color:#333}
.post-list-header .post-count{color:#999;font-size:.82rem}
.post-card{padding:16px 20px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .15s;animation:fadeUp .3s ease}
.post-card:hover{background:#fafafa}
.post-card .post-title{font-size:1rem;font-weight:500;color:#333;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-card .post-excerpt{font-size:.82rem;color:#999;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.post-card .post-meta{display:flex;align-items:center;gap:12px;font-size:.75rem;color:#bbb}
.post-card .post-meta img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.post-card .post-meta .author-name{color:#666}
.post-card .post-meta .stat{color:#ccc}
.post-card .post-meta .stat span{color:#7c6cf0;font-weight:500}
.empty-state{text-align:center;padding:60px 20px;color:#ccc}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
.empty-state p{font-size:.9rem}
.post-detail-header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}
.post-detail-header .back-btn{width:32px;height:32px;border-radius:50%;border:1px solid #eee;background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#666}
.post-detail-header .back-btn:hover{background:#f5f5f5}
.post-detail-header h3{font-size:1rem;font-weight:600;color:#333;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-detail{padding:20px;border-bottom:8px solid #f5f5f5}
.post-detail .pd-author{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-detail .pd-author img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.post-detail .pd-author .pd-name{font-weight:500;font-size:.9rem}
.post-detail .pd-author .pd-time{color:#bbb;font-size:.75rem}
.post-detail .pd-title{font-size:1.15rem;font-weight:600;margin-bottom:10px;line-height:1.4}
.post-detail .pd-body{font-size:.92rem;line-height:1.7;color:#444;white-space:pre-wrap;word-break:break-word}
.post-detail .pd-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.post-detail .pd-images img{max-width:100%;max-height:300px;border-radius:12px;cursor:pointer}
.post-detail .pd-stats{display:flex;gap:16px;margin-top:14px;font-size:.78rem;color:#bbb}
.post-detail .pd-stats span{color:#7c6cf0;font-weight:500}
.replies-section{padding:16px 20px}
.replies-section .section-title{font-size:.9rem;font-weight:500;color:#666;margin-bottom:12px}
.reply-card{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid #f5f5f5;animation:fadeUp .25s ease}
.reply-card:last-child{border-bottom:none}
.reply-card .reply-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#f0f0f0;flex-shrink:0}
.reply-card .reply-body{flex:1;min-width:0}
.reply-card .reply-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.reply-card .reply-name{font-size:.82rem;font-weight:500;color:#666}
.reply-card .reply-time{font-size:.7rem;color:#ccc}
.reply-card .reply-text{font-size:.88rem;line-height:1.6;color:#333;white-space:pre-wrap;word-break:break-word}
.reply-card .reply-images{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.reply-card .reply-images img{max-width:150px;max-height:150px;border-radius:8px;cursor:pointer}
.reply-input-area{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #eee;background:#fff;position:sticky;bottom:0}
.reply-input-area input[type=text]{flex:1;padding:10px 16px;border-radius:24px;border:1px solid #eee;background:#fafafa;color:#333;font-size:.9rem;outline:none;transition:border-color .2s}
.reply-input-area input[type=text]:focus{border-color:#7c6cf0}
.reply-input-area .tool-btn{width:40px;height:40px;border-radius:50%;border:1px solid #eee;background:#fff;color:#999;font-size:1.2rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reply-input-area .tool-btn:hover{background:#f5f5f5;color:#7c6cf0;border-color:#7c6cf0}
.forum-body{max-width:800px;margin:0 auto;padding:0}
.forum-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.forum-header .header-left{display:flex;align-items:center;gap:10px}
.forum-header .header-left h2{font-size:1.05rem;font-weight:600;color:#333}
.forum-header .user-badge{display:flex;align-items:center;gap:10px}
.forum-header .user-badge .my-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#f0f0f0}
.forum-header .user-badge .my-name{font-size:.85rem;color:#666}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 24px;border-radius:20px;font-size:.85rem;z-index:200;animation:fadeIn .3s ease;pointer-events:none}
@media(max-width:500px){.post-card{padding:14px 16px}.post-detail{padding:16px}.replies-section{padding:12px 16px}.reply-card .reply-images img{max-width:100px;max-height:100px}.modal-panel{border-radius:16px 16px 0 0;padding:20px}}
</style></head><body style="opacity:1!important">
<div id="loginScreen">
  <div class="logo">🔒</div>
  <h1>偷<span>狗</span></h1>
  <p>输入密码进入偷狗论坛</p>
  <div class="login-field"><label>🔑 房间密码</label><input type="password" id="roomPassword" placeholder="输入密码进入" /></div>
  <div class="login-field"><label>👤 昵称</label><input type="text" id="nicknameInput" placeholder="给自己取个名字" maxlength="12" /></div>

    <label class="section-label">🎭 头像</label>
    <div class="avatar-tabs">
      <span class="avatar-tab active" data-tab="gallery">🖼️ 头像库</span>
      <span class="avatar-tab" data-tab="upload">📁 上传</span>
    </div>
    <div id="avatarGallery" class="avatar-gallery"></div>
    <div id="avatarUploadPanel" style="display:none;">
      <div class="avatar-preview-row">
        <img id="avatarPreview" src="" />
        <button class="btn-secondary" id="uploadAvatarBtn">📁 选择图片</button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" />
      </div>
    </div>
  </div>
  <button class="btn-primary" id="enterBtn">🔓 进入论坛</button>
  <div class="login-error" id="loginError"></div>
</div>
<div id="forumScreen">
  <div class="forum-header">
    <div class="header-left"><h2>📋 偷狗论坛</h2></div>
    <div class="user-badge"><img id="myAvatarDisplay" class="my-avatar" src="" /><span class="my-name" id="myNameDisplay">我</span><button class="btn-ghost" id="logoutBtn">退出</button></div>
  </div>
  <div id="postListView" class="forum-body">
    <div class="post-list-header"><h3>📌 全部帖子</h3><span class="post-count" id="postCount">0 个帖子</span></div>

    <div class="empty-state" id="emptyState"><div class="empty-icon">📭</div><p>还没有帖子，来发第一个吧</p></div>
    <button class="btn-primary" id="newPostFAB" style="position:fixed;bottom:24px;right:24px;width:auto;padding:14px 24px;border-radius:30px;box-shadow:0 4px 20px rgba(124,108,240,.35);z-index:20;">✏️ 发帖</button>
  </div>
  <div id="postDetailView" style="display:none;">
    <div class="post-detail-header"><button class="back-btn" id="backToListBtn">‹</button><h3 id="detailTitle">帖子详情</h3></div>
    <div class="forum-body" id="detailBody">
      <div class="post-detail" id="postDetailContent"></div>
      <div class="replies-section" id="repliesSection"><div class="section-title">💬 回复</div><div id="repliesList"></div></div>
    </div>
    <div class="reply-input-area" id="replyInputArea">
      <button class="tool-btn" id="replyImageBtn">🖼️</button>
      <input type="file" id="replyImageInput" accept="image/*" style="display:none" />
      <input type="text" id="replyInput" placeholder="写下你的回复…" maxlength="500" />
      <button class="btn-primary" id="replySendBtn" style="width:auto;padding:10px 20px;border-radius:24px;font-weight:500;">回复</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="newPostOverlay">
  <div class="modal-panel">
    <h3>✏️ 发新帖<button class="close-btn" id="closeNewPost">✕</button></h3>

    <div class="field"><label>📄 内容</label><textarea id="newPostBody" placeholder="想说点什么…" maxlength="2000"></textarea></div>

      <label>🖼️ 图片（最多 5 张）</label>
      <div class="image-upload-area" id="newPostImagesArea">

        <input type="file" id="newPostImageInput" accept="image/*" multiple style="display:none" />
      </div>
    </div>
    <button class="btn-primary" id="newPostSubmit">📮 发布帖子</button>
  </div>
</div>
<script>
var PASSWORD="199796";
var AVATARS=["https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_1.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_2.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_3.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_4.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_5.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_6.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_7.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_8.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_9.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_10.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_11.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_12.jpg","https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/momo_13.jpg"];
var MAX_IMG=5;
var PROFILE_KEY="cc_f_profile";

// Data keys
var POSTS_KEY="cc_f_posts",USERS_KEY="cc_f_users",VIEWS_KEY="cc_f_views";
// Remote forum_data.json URL (read-only sync)
var DATA_RAW="https://raw.githubusercontent.com/k95120336-wq/secret-chat/main/forum_data.json";
function loadRemote(cb){
  var x=new XMLHttpRequest();x.open("GET",DATA_RAW,true);
  x.onload=function(){
    try{
      var d=JSON.parse(x.responseText);
      var localPosts=JSON.parse(localStorage.getItem(POSTS_KEY)||"[]");
      var localIds={};localPosts.forEach(function(p){localIds[p.id]=true});
      (d.posts||[]).forEach(function(p){if(!localIds[p.id]){localPosts.push(p);localIds[p.id]=true}});
      localStorage.setItem(POSTS_KEY,JSON.stringify(localPosts));
      var localUsers=JSON.parse(localStorage.getItem(USERS_KEY)||"[]");
      var localNames={};localUsers.forEach(function(u){localNames[u.nickname]=true});
      (d.users||[]).forEach(function(u){if(!localNames[u.nickname]){localUsers.push(u);localNames[u.nickname]=true}});
      localStorage.setItem(USERS_KEY,JSON.stringify(localUsers));
      var localViews=JSON.parse(localStorage.getItem(VIEWS_KEY)||"{}");
      Object.keys(d.views||{}).forEach(function(k){if(!localViews[k])localViews[k]=d.views[k]});
      localStorage.setItem(VIEWS_KEY,JSON.stringify(localViews));
    }catch(e){}if(cb)cb()
  };
  x.onerror=function(){if(cb)cb()};x.send();
}
function gp(){try{return JSON.parse(localStorage.getItem(POSTS_KEY)||"[]")}catch{return[]}}
function sp(p){try{localStorage.setItem(POSTS_KEY,JSON.stringify(p))}catch{}}
function gu(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||"[]")}catch{return[]}}
function su(u){try{localStorage.setItem(USERS_KEY,JSON.stringify(u))}catch{}}
function gv(){try{return JSON.parse(localStorage.getItem(VIEWS_KEY)||"{}")}catch{return{}}}
function sv(v){try{localStorage.setItem(VIEWS_KEY,JSON.stringify(v))}catch{}}
function pv(id){var v=gv();return v[id]?v[id].length:0}
function mv(id,n){var v=gv();if(!v[id])v[id]=[];if(!v[id].includes(n)){v[id].push(n);sv(v)}}
function uv(id,n){var v=gv();return v[id]&&v[id].includes(n)}
function id6(){return Date.now().toString(36)+Math.random().toString(36).substr(2,4)}
function eh(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function z(n){return n<10?"0"+n:""+n}
function ft(ts){var d=new Date(ts);return z(d.getMonth()+1)+"/"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes())}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}
function loadProfile(){try{var d=localStorage.getItem(PROFILE_KEY);return d?JSON.parse(d):null}catch{return null}}
function saveProfile(){if(!cu)return;try{localStorage.setItem(PROFILE_KEY,JSON.stringify({nickname:cu.nickname,avatar:cu.avatar}))}catch{}}
function clearProfile(){try{localStorage.removeItem(PROFILE_KEY)}catch{}}
var cu=null,sa=AVATARS[0],vpid=null,npi=[],replyImages=[];
var $=function(i){return document.getElementById(i)};
var LS=$("loginScreen"),FS=$("forumScreen"),RP=$("roomPassword"),NI=$("nicknameInput"),LE=$("loginError"),EB=$("enterBtn");
var AG=$("avatarGallery"),AT=document.querySelectorAll(".avatar-tab"),AUP=$("avatarUploadPanel"),AI=$("avatarInput"),AP=$("avatarPreview"),UAB=$("uploadAvatarBtn");
var PLV=$("postListView"),PDV=$("postDetailView"),PLE=$("postList"),ES=$("emptyState"),PC=$("postCount"),NPF=$("newPostFAB"),NPO=$("newPostOverlay"),CNP=$("closeNewPost");
var NPT=$("newPostTitle"),NPB=$("newPostBody"),NPII=$("newPostImageInput"),NPAI=$("newPostAddImage"),NPIA=$("newPostImagesArea"),NPS=$("newPostSubmit");
var BTL=$("backToListBtn"),DT=$("detailTitle"),PDC=$("postDetailContent"),RL=$("repliesList"),RI=$("replyInput"),RSB=$("replySendBtn"),RIB=$("replyImageBtn"),RII=$("replyImageInput");
var MAD=$("myAvatarDisplay"),MND=$("myNameDisplay"),LOB=$("logoutBtn");
AVATARS.forEach(function(u,i){
  var img=document.createElement("img");
  img.className="avatar-item"+(i===0?" selected":"");img.src=u;
  img.addEventListener("click",function(){
    document.querySelectorAll(".avatar-item").forEach(function(e){e.classList.remove("selected")});
    img.classList.add("selected");sa=u;
  });
  AG.appendChild(img);
});
AT.forEach(function(t){
  t.addEventListener("click",function(){
    AT.forEach(function(x){x.classList.remove("active")});t.classList.add("active");
    if(t.dataset.tab==="gallery"){AG.style.display="flex";AUP.style.display="none"}
    else{AG.style.display="none";AUP.style.display="block"}
  });
});
UAB.addEventListener("click",function(){AI.click()});
AI.addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert("图片超过 2MB");return}
  var r=new FileReader();
  r.onload=function(ev){sa=ev.target.result;AP.src=sa;document.querySelectorAll(".avatar-item").forEach(function(e){e.classList.remove("selected")})};
  r.readAsDataURL(f);AI.value="";
});
EB.addEventListener("click",enter);
NI.addEventListener("keydown",function(e){if(e.key==="Enter")enter()});
RP.addEventListener("keydown",function(e){if(e.key==="Enter")enter()});
function enter(){
  var p=RP.value.trim(),n=NI.value.trim();
  if(p!==PASSWORD){LE.textContent="❌ 密码错误";RP.value="";RP.focus();return}
  if(!n){LE.textContent="❌ 请输入昵称";NI.focus();return}
  LE.textContent="";
  var us=gu();
  if(!us.find(function(u){return u.nickname===n})){
    us.push({nickname:n,avatar:sa,registeredAt:Date.now()});su(us);
  }
  cu={nickname:n,avatar:sa};
  LS.style.display="none";FS.style.display="block";
  MAD.src=cu.avatar;MND.textContent=cu.nickname;
  renderList();
}
function renderList(){
  PDV.style.display="none";PLV.style.display="block";
  var ps=gp();PC.textContent=ps.length+" 个帖子";
  if(ps.length===0){PLE.innerHTML="";ES.style.display="block";return}
  ES.style.display="none";PLE.innerHTML="";
  [].concat(ps).reverse().forEach(function(p){
    var v=pv(p.id),r=(p.replies||[]).length,ex=(p.body||"").replace(/\n/g," ").substring(0,80);
    var cd=document.createElement("div");cd.className="post-card";
    cd.innerHTML='<div class="post-meta"><img src="'+eh(p.authorAvatar)+'" /><span class="author-name">'+eh(p.authorName)+'</span><span class="stat">👁️ <span>'+v+'</span></span><span class="stat">💬 <span>'+r+'</span></span></div><div class="post-title">'+eh(p.title)+'</div><div class="post-excerpt">'+eh(ex)+'</div>';
    cd.addEventListener("click",function(){openPost(p.id)});
    PLE.appendChild(cd);
  });
}
NPF.addEventListener("click",function(){NPO.classList.add("show");NPT.focus()});
CNP.addEventListener("click",closeNewPostModal);
NPO.addEventListener("click",function(e){if(e.target===NPO)closeNewPostModal()});
function closeNewPostModal(){NPO.classList.remove("show");NPT.value="";NPB.value="";npi=[];renderNewPostImages()}
NPAI.addEventListener("click",function(){NPII.click()});
NPII.addEventListener("change",function(e){
  var files=Array.from(e.target.files);
  for(var i=0;i<files.length;i++){
    if(npi.length>=MAX_IMG)break;
    var f=files[i];
    if(f.size>2*1024*1024)continue;
    var r=new FileReader();
    r.onload=function(ev){npi.push(ev.target.result);renderNewPostImages()};
    r.readAsDataURL(f);
  }
  NPII.value="";
});
function renderNewPostImages(){
  var imgs=NPIA.querySelectorAll(".image-preview-wrap");
  imgs.forEach(function(e){e.remove()});
  npi.forEach(function(url,i){
    var wrap=document.createElement("div");wrap.className="image-preview-wrap";
    var img=document.createElement("img");img.className="image-preview";img.src=url;
    var rm=document.createElement("button");rm.className="remove-img";rm.textContent="✕";
    rm.addEventListener("click",function(){npi.splice(i,1);renderNewPostImages()});
    wrap.appendChild(img);wrap.appendChild(rm);
    NPIA.insertBefore(wrap,NPIA.lastElementChild);
  });
  NPAI.style.display=npi.length>=MAX_IMG?"none":"flex";
}
NPS.addEventListener("click",function(){
  var t=NPT.value.trim(),b=NPB.value.trim();
  if(!t){alert("请输入标题");return}
  if(!b&&npi.length===0){alert("请输入内容或添加图片");return}
  var post={id:id6(),title:t,body:b,images:npi.slice(),authorName:cu.nickname,authorAvatar:cu.avatar,replies:[],createdAt:Date.now()};
  var ps=gp();ps.push(post);sp(ps);
  closeNewPostModal();renderList();toast("帖子已发布");
});
function openPost(id){
  if(!uv(id,cu.nickname))mv(id,cu.nickname);
  var ps=gp(),p=ps.find(function(x){return x.id===id});
  if(!p)return;vpid=id;
  PLV.style.display="none";PDV.style.display="block";
  DT.textContent=p.title;renderDetail(p);RI.value="";RI.focus();
}
function renderDetail(p){
  var v=pv(p.id),r=(p.replies||[]).length;
  var html='<div class="pd-author"><img src="'+eh(p.authorAvatar)+'" /><span class="pd-name">'+eh(p.authorName)+'</span><span class="pd-time">'+ft(p.createdAt)+'</span></div>';
  html+='<div class="pd-title">'+eh(p.title)+'</div>';
  html+='<div class="pd-body">'+eh(p.body||"")+'</div>';
  if(p.images&&p.images.length){
    html+='<div class="pd-images">';
    p.images.forEach(function(u){html+='<img src="'+u+'" onclick="window.open(this.src)" />'});
    html+='</div>';
  }
  html+='<div class="pd-stats">👁️ <span>'+v+'</span> 次阅读 &nbsp;💬 <span>'+r+'</span> 条回复</div>';
  PDC.innerHTML=html;
  RL.innerHTML="";
  var reps=p.replies||[];
  if(reps.length===0){RL.innerHTML='<div style="text-align:center;padding:30px 0;color:#ccc;font-size:.85rem">还没有回复</div>'}
  else{
    reps.forEach(function(rep){
      var rc=document.createElement("div");rc.className="reply-card";
      var rh='<img class="reply-avatar" src="'+eh(rep.authorAvatar)+'" />';
      rh+='<div class="reply-body"><div class="reply-header"><span class="reply-name">'+eh(rep.authorName)+'</span><span class="reply-time">'+ft(rep.createdAt)+'</span></div>';
      rh+='<div class="reply-text">'+eh(rep.text||"")+'</div>';
      if(rep.images&&rep.images.length){
        rh+='<div class="reply-images">';
        rep.images.forEach(function(u){rh+='<img src="'+u+'" onclick="window.open(this.src)" />'});
        rh+='</div>';
      }
      rh+='</div>';rc.innerHTML=rh;RL.appendChild(rc);
    });
  }
}
BTL.addEventListener("click",function(){renderList()});
RIB.addEventListener("click",function(){RII.click()});
RII.addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert("图片超过 2MB");return}
  var r=new FileReader();
  r.onload=function(ev){replyImages.push(ev.target.result);toast("已添加图片 ("+replyImages.length+")");RIB.style.opacity=replyImages.length>=MAX_IMG?"0.3":"1"};
  r.readAsDataURL(f);RII.value="";
});
RSB.addEventListener("click",sendReply);
RI.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply()}});
function sendReply(){
  var t=RI.value.trim();
  if(!t&&replyImages.length===0){RI.focus();return}
  var reply={authorName:cu.nickname,authorAvatar:cu.avatar,text:t,images:replyImages.slice(),createdAt:Date.now()};
  var ps=gp(),p=ps.find(function(x){return x.id===vpid});
  if(!p){toast("帖子不存在");return}
  if(!p.replies)p.replies=[];
  p.replies.push(reply);sp(ps);
  RI.value="";replyImages=[];RIB.style.opacity="1";
  renderDetail(p);toast("回复成功");
}
LOB.addEventListener("click",function(){cu=null;vpid=null;clearProfile();FS.style.display="none";LS.style.display="block";RP.value="";LE.textContent=""});
</script></body></html>
