<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 常常 · 聊天室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #333;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== Login ===== */
  #loginScreen {
    width: 100%;
    max-width: 440px;
    padding: 40px 24px;
    text-align: center;
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  #loginScreen .logo { font-size: 3rem; margin-bottom: 8px; }
  #loginScreen h1 { font-size: 1.8rem; font-weight: 600; color: #333; margin-bottom: 4px; letter-spacing: 4px; }
  #loginScreen h1 span { color: #7c6cf0; }
  #loginScreen p { color: #999; font-size: 0.85rem; margin-bottom: 28px; }

  .login-error { color: #ff6b6b; font-size: 0.82rem; margin-top: 8px; min-height: 1.2em; }

  .login-field { margin-bottom: 14px; text-align: left; }
  .login-field label {
    display: block;
    font-size: 0.82rem;
    color: #999;
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
    background: #fafafa;
    color: #333;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s;
  }
  .login-field input:focus { border-color: #7c6cf0; }

  /* ===== Avatar Section ===== */
  .avatar-section { margin-bottom: 16px; text-align: left; }
  .avatar-section .section-label {
    font-size: 0.82rem; color: #999; margin-bottom: 8px; display: block;
  }

  .avatar-tabs {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .avatar-tab {
    padding: 6px 16px; border-radius: 20px;
    font-size: 0.8rem; cursor: pointer; border: 1px solid #e0e0e0;
    background: #fafafa; color: #999; transition: all .2s;
  }
  .avatar-tab.active { background: #7c6cf0; color: #fff; border-color: #7c6cf0; }

  .avatar-gallery {
    display: flex; flex-wrap: wrap; gap: 8px;
    max-height: 120px; overflow-y: auto; padding: 4px 0;
  }
  .avatar-gallery::-webkit-scrollbar { width: 4px; }
  .avatar-gallery::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .avatar-item {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid transparent; cursor: pointer;
    object-fit: cover; background: #f5f5f5;
    transition: border-color .2s, transform .15s;
    flex-shrink: 0;
  }
  .avatar-item:hover { transform: scale(1.1); }
  .avatar-item.selected { border-color: #7c6cf0; }

  .avatar-upload-card {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px dashed #ddd; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: #ccc; background: #fafafa;
    transition: all .2s; flex-shrink: 0;
  }
  .avatar-upload-card:hover { border-color: #7c6cf0; color: #7c6cf0; }

  .avatar-preview-row {
    display: flex; align-items: center; gap: 12px; margin-top: 8px;
  }
  .avatar-preview-row img {
    width: 56px; height: 56px; border-radius: 50%;
    object-fit: cover; border: 3px solid #7c6cf0;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #7c6cf0;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    letter-spacing: 1px;
  }
  .btn-primary:hover { background: #6a5cd6; }

  /* ===== Chat ===== */
  #chatScreen {
    display: none;
    width: 100%;
    height: 100vh;
    max-width: 800px;
    margin: 0 auto;
    flex-direction: column;
    animation: fadeIn .3s ease;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  .chat-header .room-info { display: flex; align-items: center; gap: 10px; }
  .chat-header .room-info h2 { font-size: 1.05rem; font-weight: 600; color: #333; }
  .chat-header .room-info .member-count {
    font-size: 0.78rem; color: #999; background: #f0f0f0;
    padding: 2px 10px; border-radius: 10px;
  }
  .chat-header .user-badge { display: flex; align-items: center; gap: 8px; }
  .chat-header .user-badge .my-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    object-fit: cover; background: #f0f0f0;
  }
  .chat-header .logout-btn {
    padding: 6px 14px; border-radius: 8px;
    border: 1px solid #ddd; background: transparent; color: #999;
    cursor: pointer; font-size: 0.78rem; transition: all .2s;
  }
  .chat-header .logout-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

  .messages-area {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    background: #fafafa;
  }
  .messages-area::-webkit-scrollbar { width: 6px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

  .msg-system { text-align: center; color: #bbb; font-size: 0.78rem; padding: 4px 0; }

  .msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn .25s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.own { align-self: flex-end; flex-direction: row-reverse; }
  .msg.other { align-self: flex-start; }

  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    object-fit: cover; background: #f0f0f0; flex-shrink: 0;
  }
  .msg-body { min-width: 0; }
  .msg .msg-name { font-size: 0.75rem; color: #999; margin-bottom: 3px; }
  .msg.own .msg-name { text-align: right; }
  .msg .msg-bubble {
    padding: 10px 14px; border-radius: 16px;
    font-size: 0.9rem; line-height: 1.55;
    word-break: break-word; display: inline-block;
  }
  .msg.own .msg-bubble { background: #7c6cf0; color: #fff; border-bottom-right-radius: 4px; }
  .msg.other .msg-bubble { background: #fff; color: #333; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  .msg .msg-time { font-size: 0.68rem; color: #bbb; margin-top: 2px; }
  .msg.own .msg-time { text-align: right; }
  .msg img.msg-img {
    max-width: 200px; max-height: 200px;
    border-radius: 12px; display: block; margin-top: 4px;
    cursor: pointer; transition: transform .2s;
  }
  .msg img.msg-img:hover { transform: scale(1.03); }

  .chat-input {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px; background: #fff;
    border-top: 1px solid #eee; flex-shrink: 0;
  }
  .chat-input .tool-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid #eee; background: #fff; color: #999;
    font-size: 1.2rem; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .chat-input .tool-btn:hover { background: #f5f5f5; color: #7c6cf0; border-color: #7c6cf0; }

  .chat-input input[type="text"] {
    flex: 1; padding: 10px 16px; border-radius: 24px;
    border: 1px solid #eee; background: #fafafa;
    color: #333; font-size: 0.9rem; outline: none; transition: border-color .2s;
  }
  .chat-input input[type="text"]:focus { border-color: #7c6cf0; }
  .chat-input .send-btn {
    padding: 10px 20px; border-radius: 24px;
    border: none; background: #7c6cf0; color: #fff;
    font-size: 0.9rem; cursor: pointer; font-weight: 500;
    transition: background .2s; white-space: nowrap;
  }
  .chat-input .send-btn:hover { background: #6a5cd6; }

  .emoji-picker {
    display: none;
    position: absolute; bottom: 72px; left: 20px;
    width: 300px; max-height: 220px;
    background: #fff; border: 1px solid #eee;
    border-radius: 16px; padding: 12px; overflow-y: auto;
    z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,.08);
  }
  .emoji-picker.show { display: block; }
  .emoji-picker .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-picker .emoji-item {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; cursor: pointer; border-radius: 8px;
    transition: background .15s;
  }
  .emoji-picker .emoji-item:hover { background: #f5f5f5; }

  .chat-input-wrap { position: relative; flex: 1; display: flex; align-items: center; gap: 8px; }

  @media (max-width: 500px) {
    #loginScreen { padding: 24px 16px; }
    .msg { max-width: 92%; }
    .emoji-picker { width: 260px; left: 8px; }
  }
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="loginScreen">
  <div class="logo">🔒</div>
  <h1>常<span>常</span></h1>
  <p>输入密码进入常常聊天室</p>

  <div class="login-field">
    <label>🔑 房间密码</label>
    <input type="password" id="roomPassword" placeholder="输入密码进入" />
  </div>
  <div class="login-field">
    <label>👤 昵称</label>
    <input type="text" id="nicknameInput" placeholder="给自己取个名字" maxlength="12" />
  </div>

  <div class="avatar-section">
    <label class="section-label">🎭 头像</label>
    <div class="avatar-tabs">
      <span class="avatar-tab active" data-tab="gallery">🖼️ 头像库</span>
      <span class="avatar-tab" data-tab="upload">📁 上传</span>
    </div>
    <div id="avatarGallery" class="avatar-gallery"></div>
    <div id="avatarUploadPanel" style="display:none;">
      <div class="avatar-preview-row">
        <img id="avatarPreview" src="" />
        <button class="upload-avatar-btn" style="padding:8px 18px;border-radius:10px;border:1px solid #7c6cf0;background:transparent;color:#7c6cf0;font-size:0.85rem;cursor:pointer;">📁 选择图片</button>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" />
      </div>
    </div>
  </div>

  <button class="btn-primary" id="enterBtn">🔓 进入聊天室</button>
  <div class="login-error" id="loginError"></div>
</div>

<!-- ===== Chat ===== -->
<div id="chatScreen">
  <div class="chat-header">
    <div class="room-info">
      <h2>💬 常常聊天</h2>
      <span class="member-count" id="memberCount">1 人在线</span>
    </div>
    <div class="user-badge">
      <img id="myAvatarDisplay" class="my-avatar" src="" />
      <span id="myNameDisplay">我</span>
      <button class="logout-btn" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="messages-area" id="messagesArea"></div>

  <div class="chat-input">
    <div class="chat-input-wrap">
      <button class="tool-btn" id="emojiBtn">😊</button>
      <button class="tool-btn" id="imageBtn">🖼️</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none" />
      <input type="text" id="messageInput" placeholder="说点什么…" maxlength="500" />
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<script>
// ============================================================
// 🔑 房间密码
// ============================================================
const ROOM_PASSWORD = "199796";

// ============================================================
// 🎭 Momo 头像库（SVG 生成，风格统一）
// ============================================================
// ============================================================
// 🎭 Momo 头像库（三张用户提供的图片）
// ============================================================
const MOMO_AVATAR_FILES = ['momo_1.jpg', 'momo_2.jpg', 'momo_3.jpg'];
// ============================================================
const EMOJIS = ["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🥰","😍","🤩","😘","😗","😚","😋","😛","😜","🤪","😝","🤑","🤗","🤭","🤔","🤐","😑","😶","😏","😒","🙄","😬","😮","😯","😲","😳","🥺","😢","😭","😤","😡","🤬","😈","👿","💀","☠️","💩","🤡","👹","👺","✨","🌟","💫","⭐","🔥","💥","💯","❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💗","💖","💘","💝","🎉","🎊","🎈","🎁","👋","✋","👌","👍","👎","👏","🙌","🤝","💪","🙏","💅"];

// ============================================================
// 📦 本地存储
// ============================================================
const STORAGE_KEY = 'cc_chat_messages';

function loadMessages() {
  try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : []; }
  catch { return []; }
}
function saveMessages(msgs) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs)); }
  catch(e) { console.warn('保存失败', e); }
}

// ============================================================
// 🧑 当前用户
// ============================================================
let currentUser = { nickname: '', avatar: '' };
let selectedAvatarDataUrl = '';

// ============================================================
// 🖥️ DOM
// ============================================================
const loginScreen = document.getElementById('loginScreen');
const chatScreen = document.getElementById('chatScreen');
const roomPassword = document.getElementById('roomPassword');
const nicknameInput = document.getElementById('nicknameInput');
const loginError = document.getElementById('loginError');
const enterBtn = document.getElementById('enterBtn');

const avatarGallery = document.getElementById('avatarGallery');
const avatarTabs = document.querySelectorAll('.avatar-tab');
const avatarUploadPanel = document.getElementById('avatarUploadPanel');
const avatarInput = document.getElementById('avatarInput');
const avatarPreview = document.getElementById('avatarPreview');

const messagesArea = document.getElementById('messagesArea');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.getElementById('emojiPicker');
const imageBtn = document.getElementById('imageBtn');
const imageInput = document.getElementById('imageInput');
const logoutBtn = document.getElementById('logoutBtn');
const memberCount = document.getElementById('memberCount');
const myAvatarDisplay = document.getElementById('myAvatarDisplay');
const myNameDisplay = document.getElementById('myNameDisplay');

// ============================================================
// 🎭 渲染头像库（使用图片文件）
// ============================================================
MOMO_AVATAR_FILES.forEach((file, i) => {
  const img = document.createElement('img');
  img.className = 'avatar-item' + (i === 0 ? ' selected' : '');
  img.src = file;
  img.dataset.index = i;
  img.addEventListener('click', () => selectMomoAvatar(file, img));
  avatarGallery.appendChild(img);
});

function selectMomoAvatar(file, el) {
  document.querySelectorAll('.avatar-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedAvatarDataUrl = file;
}

// 默认选中第一个
selectedAvatarDataUrl = MOMO_AVATAR_FILES[0];

// ============================================================
// 🎭 切换 头像库 / 上传
// ============================================================
avatarTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    avatarTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    if (tab.dataset.tab === 'gallery') {
      avatarGallery.style.display = 'flex';
      avatarUploadPanel.style.display = 'none';
    } else {
      avatarGallery.style.display = 'none';
      avatarUploadPanel.style.display = 'block';
    }
  });
});

// ============================================================
// 🖼️ 头像上传
// ============================================================
document.querySelector('.upload-avatar-btn')?.addEventListener('click', () => avatarInput.click());
avatarInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { alert('图片超过 2MB'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    selectedAvatarDataUrl = ev.target.result;
    avatarPreview.src = selectedAvatarDataUrl;
    // 取消头像库选中
    document.querySelectorAll('.avatar-item').forEach(e => e.classList.remove('selected'));
  };
  reader.readAsDataURL(file);
  avatarInput.value = '';
});

// ============================================================
// 😊 Emoji 面板
// ============================================================
const emojiGrid = document.createElement('div');
emojiGrid.className = 'emoji-grid';
EMOJIS.forEach(e => {
  const div = document.createElement('div');
  div.className = 'emoji-item';
  div.textContent = e;
  div.addEventListener('click', () => { messageInput.value += e; messageInput.focus(); });
  emojiGrid.appendChild(div);
});
emojiPicker.appendChild(emojiGrid);

emojiBtn.addEventListener('click', (e) => { e.stopPropagation(); emojiPicker.classList.toggle('show'); });
document.addEventListener('click', () => emojiPicker.classList.remove('show'));

// ============================================================
// 🔓 登录
// ============================================================
enterBtn.addEventListener('click', enterRoom);
nicknameInput.addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });
roomPassword.addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });

function enterRoom() {
  const pwd = roomPassword.value.trim();
  const nick = nicknameInput.value.trim();

  if (pwd !== ROOM_PASSWORD) {
    loginError.textContent = '❌ 密码错误，请重试';
    roomPassword.value = ''; roomPassword.focus(); return;
  }
  if (!nick) {
    loginError.textContent = '❌ 请输入昵称'; nicknameInput.focus(); return;
  }
  if (!selectedAvatarDataUrl) {
    loginError.textContent = '❌ 请选择或上传头像'; return;
  }

  loginError.textContent = '';
  currentUser = { nickname: nick, avatar: selectedAvatarDataUrl };
  enterChat();
}

function enterChat() {
  loginScreen.style.display = 'none';
  chatScreen.style.display = 'flex';

  myAvatarDisplay.src = currentUser.avatar;
  myNameDisplay.textContent = currentUser.nickname;

  updateMemberCount();
  const msgs = loadMessages();
  msgs.forEach(m => renderMessage(m, false));
  addSystemMessage(`${currentUser.nickname} 进入了聊天室`);
  scrollToBottom();
  messageInput.focus();
}

// ============================================================
// 📊 在线人数
// ============================================================
function updateMemberCount() {
  const msgs = loadMessages();
  const users = new Set();
  msgs.forEach(m => { if (m.type === 'message') users.add(m.nickname); });
  users.add(currentUser.nickname);
  memberCount.textContent = `${users.size} 人在线`;
}

// ============================================================
// 💬 消息
// ============================================================
function renderMessage(m, animate = true) {
  if (m.type === 'system') {
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.textContent = m.text;
    messagesArea.appendChild(div);
    return;
  }

  const isOwn = m.nickname === currentUser.nickname;
  const div = document.createElement('div');
  div.className = `msg ${isOwn ? 'own' : 'other'}`;

  let bubble = '';
  if (m.text) bubble += `<div class="msg-bubble">${escapeHtml(m.text)}</div>`;
  if (m.image) bubble += `<img class="msg-img" src="${m.image}" alt="图片" onclick="window.open('${m.image}','_blank')" />`;

  div.innerHTML = `
    <img class="msg-avatar" src="${m.avatar}" />
    <div class="msg-body">
      <div class="msg-name">${isOwn ? '我' : escapeHtml(m.nickname)}</div>
      ${bubble}
      <div class="msg-time">${formatTime(m.time)}</div>
    </div>
  `;
  messagesArea.appendChild(div);
}

function addSystemMessage(text) {
  const msg = { type: 'system', text, time: Date.now() };
  const msgs = loadMessages(); msgs.push(msg); saveMessages(msgs);
  renderMessage(msg); scrollToBottom();
}

function addUserMessage(text, imageDataUrl = null) {
  const msg = {
    type: 'message', nickname: currentUser.nickname,
    avatar: currentUser.avatar, text: text || '', image: imageDataUrl, time: Date.now()
  };
  const msgs = loadMessages(); msgs.push(msg); saveMessages(msgs);
  renderMessage(msg); scrollToBottom();
  updateMemberCount();
}

function formatTime(ts) {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function scrollToBottom() {
  setTimeout(() => { messagesArea.scrollTop = messagesArea.scrollHeight; }, 20);
}

// ============================================================
// 📤 发送
// ============================================================
function sendMessage() {
  const text = messageInput.value.trim();
  if (text) { addUserMessage(text); messageInput.value = ''; }
  messageInput.focus();
}
sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// ============================================================
// 🖼️ 聊天图片
// ============================================================
imageBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { addSystemMessage('⚠️ 图片超过 2MB'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => { addUserMessage('', ev.target.result); };
  reader.readAsDataURL(file);
  imageInput.value = '';
});

// ============================================================
// 🚪 退出
// ============================================================
logoutBtn.addEventListener('click', () => {
  addSystemMessage(`${currentUser.nickname} 离开了聊天室`);
  chatScreen.style.display = 'none';
  loginScreen.style.display = 'block';
  roomPassword.value = '';
  nicknameInput.value = currentUser.nickname;
  loginError.textContent = '';
});
</script>
